name: PCBeta 每6小时打卡

on:
  schedule:
    - cron: '0 */6 * * *'   # UTC时间每6小时执行
  workflow_dispatch:        # 保留手动触发

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 缓存 Node 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 安装浏览器
        run: npx playwright install chromium --with-deps

      - name: 运行打卡任务
        env:
          PC_BETA_COOKIES: ${{ secrets.PC_BETA_COOKIES }}
        run: node scripts/pcbeta-task.js

      - name: 上传截图工件
        uses: actions/upload-artifact@v4
        with:
          name: task‑screenshots
          path: ./*.png
          retention-days: 7
