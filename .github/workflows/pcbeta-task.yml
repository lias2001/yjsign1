name: PCBeta
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - env:
          PC_BETA_COOKIES: ${{ secrets.PC_BETA_COOKIES }}
        run: node scripts/pcbeta-task.js
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: ./*.png
